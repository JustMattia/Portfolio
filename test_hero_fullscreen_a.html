<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #141414;
    --h-font: clamp(3.2rem, 14vw, 12rem);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg);
    color: #fff;
    font-family: 'Archivo', sans-serif;
    overflow-x: clip;
  }
  .top {
    height: 60px;
    background: rgba(20,20,20,.9);
    border-bottom: 1px solid rgba(255,255,255,.06);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-inline: 40px;
    font-size: 14px;
    font-weight: bold;
  }
  .display {
    font-family: 'Archivo Black', Impact, sans-serif;
    text-transform: uppercase;
  }
  
  /* OPTION A: Centered */
  .hero-a {
    min-height: calc(100vh - 60px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
    background: radial-gradient(circle 600px at 50% 55%, rgba(65, 28, 25, .5) 0%, transparent 70%);
    padding-inline: 20px;
  }
  .hero-a .wrap {
    width: 100%;
    max-width: 1360px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .hero-a h1 {
    font-size: var(--h-font);
    line-height: .88;
    letter-spacing: .015em;
    white-space: nowrap;
    position: relative;
    z-index: 1;
  }
  .hero-a .hero-img-wrap {
    position: relative;
    z-index: 2;
    width: 100%;
    display: flex;
    justify-content: center;
    margin-top: calc(var(--h-font) * -0.38);
  }
  .hero-a .hero-img-wrap img {
    width: min(78%, 920px);
    height: auto;
    display: block;
  }
  
  /* Next section */
  .about-preview {
    min-height: 80vh;
    background: #1b1b1b;
    border-top: 1px solid #262626;
    padding: 60px;
  }
</style>
</head>
<body>
  <div class="top">
    <span>3D ARTIST</span>
    <span>Mattia Santo Moltisanti</span>
  </div>
  <header class="hero-a">
    <div class="wrap">
      <h1 class="display">PORTFOLIO</h1>
      <div class="hero-img-wrap">
        <img src="assets/hero-pezzi.png" alt="Pezzi">
      </div>
    </div>
  </header>
  <section class="about-preview">
    <h2>ABOUT ME</h2>
  </section>
</body>
</html>
